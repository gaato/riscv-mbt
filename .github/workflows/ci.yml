name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # Upstream riscv-tests builds with a current GCC (Zacas/Zabha/Zalasr since
    # 2026-09); Ubuntu's riscv64-unknown-elf-gcc lags behind, Tumbleweed's does not.
    container:
      image: opensuse/tumbleweed:latest
      # The image sets no PATH, so the runner would build one from GITHUB_PATH
      # entries alone and lose /usr/bin.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read

    steps:
      - name: Install system packages
        run: |
          zypper --non-interactive install \
            autoconf \
            curl \
            gcc \
            git \
            gzip \
            make \
            tar \
            unzip \
            which \
            cross-riscv64-binutils \
            cross-riscv64-elf-gcc16

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$(cat moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - name: Build official riscv-tests ELF artifacts
        run: |
          bash ./scripts/build-riscv-tests-official.sh

      - name: Verify project
        run: |
          moon version
          moon check
          moon test
